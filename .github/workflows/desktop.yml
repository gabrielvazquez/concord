name: App para PC (Windows)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ajudante do Jogar junto (teclado, mouse e controle)
        run: dotnet publish input/ConcordInput.csproj -c Release -o inputbin

      - name: Testar o ajudante
        shell: pwsh
        run: |
          $out = "ping`nreset`n" | ./inputbin/ConcordInput.exe
          $out
          if (-not ($out -match 'ready')) { throw 'ajudante não respondeu' }

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Definir a versão
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then V="${GITHUB_REF_NAME#desktop-v}"; else V="1.1.${GITHUB_RUN_NUMBER}"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$V" >> "$GITHUB_ENV" 

      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: CONCORD para PC ${{ env.APP_VERSION }}
          make_latest: true
          overwrite_files: true
          body: |
            **CONCORD para Windows**
            - **CONCORD-Setup.exe** — instalador (recomendado). Cria atalho e pode iniciar com o Windows.
            - **CONCORD-Portatil.exe** — roda sem instalar.

            O app instalado se atualiza sozinho (Configurações → App para PC → Verificar atualizações).

            O Windows pode avisar "O Windows protegeu o computador" porque o app não tem assinatura paga. Clique em **Mais informações → Executar assim mesmo**.
          files: |
            desktop/dist/CONCORD-Setup.exe
            desktop/dist/CONCORD-Portatil.exe
            desktop/dist/latest.yml
