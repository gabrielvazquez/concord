name: App para PC (Windows)

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Usar a versão da tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#desktop-v}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: CONCORD para PC ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          make_latest: true
          body: |
            **CONCORD para Windows**
            - **CONCORD-Setup.exe** — instalador (recomendado). Cria atalho e pode iniciar com o Windows.
            - **CONCORD-Portatil.exe** — roda sem instalar.

            O Windows pode avisar "O Windows protegeu o computador" porque o app não tem assinatura paga. Clique em **Mais informações → Executar assim mesmo**.
          files: |
            desktop/dist/CONCORD-Setup.exe
            desktop/dist/CONCORD-Portatil.exe
