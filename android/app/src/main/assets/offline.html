<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>CONCORD</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#000;color:#fafafa;font:15px 'Segoe UI',system-ui,sans-serif;text-align:center}
.c{max-width:380px}h1{font-size:22px;margin:18px 0 8px}p{color:#a1a1aa;line-height:1.5}
button{margin-top:20px;background:#fff;color:#000;border:0;border-radius:12px;padding:12px 22px;font:700 14px inherit;font-family:inherit;cursor:pointer}</style></head>
<body><div class="c">
<svg width="56" height="56" viewBox="0 0 32 32"><circle cx="12.5" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2"/><circle cx="19.5" cy="16" r="7" fill="none" stroke="#fff" stroke-width="2"/></svg>
<h1>Sem conexão</h1><p>Não deu para abrir o CONCORD. Confira sua internet — tentando de novo automaticamente.</p>
<button onclick="retry()">Tentar agora</button></div>
<script>const url=new URLSearchParams(location.search).get('url'); function retry(){ if(url) location.href=url; } setInterval(()=>{ if(navigator.onLine) retry(); }, 8000);</script>
</body></html>
