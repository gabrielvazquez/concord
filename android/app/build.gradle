plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def vCode = (project.findProperty('versionCode') ?: '1') as Integer

android {
    namespace 'com.gabrielvazquez.concord'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gabrielvazquez.concord'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "2.0.${vCode}"
        resourceConfigurations += ['pt']
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        release {
            storeFile file('../concord.p12')
            storePassword 'concord-amigos'
            keyAlias 'concord'
            keyPassword 'concord-amigos'
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.kotlin_module'] } }
    dependenciesInfo { includeInApk false; includeInBundle false }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
